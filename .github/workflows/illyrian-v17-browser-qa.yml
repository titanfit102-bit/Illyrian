name: ILLYRIAN v1.7 Chromium QA
# Runner outage resolved: Playwright passed 10/10 on real ubuntu-latest runner.
# Restrict automatic runs to changes that can affect the demo or QA harness.
on:
  push:
    branches:
      - demo/v1.7-illyrian-shop
    paths:
      - 'demo/**/*.html'
      - 'demo/**/*.css'
      - 'demo/**/*.js'
      - 'qa/**'
      - 'playwright.config.cjs'
      - '.github/workflows/illyrian-v17-browser-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

# GitHub has delivered duplicate push events for the same commit.
# Keep one running check per commit alive instead of repeatedly cancelling it.
concurrency:
  group: illyrian-v17-qa-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  browser-smoke:
    if: github.repository == 'titanfit102-bit/Illyrian'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout isolated demo branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned test runner (no application dependencies)
        run: npm install --no-save --no-audit --no-fund @playwright/test@1.55.1
      - name: Install Chromium browser only (avoid slow apt dependency update)
        run: npx playwright install chromium
      - name: Run ILLYRIAN module, QA Lab, keyboard, and visual evidence tests
        run: npx playwright test
      - name: Preserve failed-case screenshots and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: illyrian-v17-qa-failures
          path: qa-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Save preview screenshots for later human review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: illyrian-v17-visual-review
          path: qa-results/visual/
          if-no-files-found: ignore
          retention-days: 14
