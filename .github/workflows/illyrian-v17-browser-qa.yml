name: ILLYRIAN v1.7 Chromium QA
# Runner outage resolved: Playwright passed 10/10 on real ubuntu-latest runner.
# Feature-branch commits are covered by the open PR's required-check candidates.
# Avoid duplicate Chromium runs for a single PR update; preserve integration push QA.
on:
  push:
    branches:
      - demo/v1.7-illyrian-shop
    paths:
      - 'demo/**/*.html'
      - 'demo/**/*.css'
      - 'demo/**/*.js'
      - 'i18n/**' # Root locale edits must trigger the browser localization tests
      - 'qa/**'
      - 'playwright.config.cjs'
      - '.github/workflows/illyrian-v17-browser-qa.yml'
  # Stage a future merge gate on the integration branch, not on main.
  # Do not path-filter required PR checks: skipped checks can remain pending.
  # This will only run for PRs targeting the integration branch once the
  # workflow configuration is present and active on the target branch.
  pull_request:
    branches:
      - demo/v1.7-illyrian-shop
  workflow_dispatch:

permissions:
  contents: read
  actions: read # Read prior successful browser evidence; no write access

# GitHub has delivered duplicate push events for the same commit.
# Keep one running check per commit alive instead of repeatedly cancelling it.
concurrency:
  group: illyrian-v17-qa-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  browser-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Test fail-closed browser classifier
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py'
      - name: Classify incremental PR delta against proven runtime
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/browser_scope.py

  browser-smoke:
    name: browser-smoke-${{ github.event_name }}
    needs: browser-scope
    if: always() && github.repository == 'titanfit102-bit/Illyrian'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      NODE_PATH: ${{ github.workspace }}/security/node_modules
    steps:
      - name: Documentation-only browser evidence reuse
        if: needs.browser-scope.outputs.docs_only == 'true'
        run: echo 'No browser tests executed here; classifier summary links the successful unchanged runtime.'
      - name: Checkout isolated demo branch
        if: needs.browser-scope.outputs.docs_only != 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false # Tests cannot access the checkout token
      - name: Browser evidence base ${{ github.event.pull_request.base.sha }}
        if: needs.browser-scope.outputs.docs_only != 'true'
        run: echo 'Recording tested PR base in immutable step metadata.'
      - name: Set up Node.js
        if: needs.browser-scope.outputs.docs_only != 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install locked test runner without lifecycle scripts
        if: needs.browser-scope.outputs.docs_only != 'true'
        run: npm ci --prefix security --ignore-scripts --no-audit --no-fund
      - name: Report runner provenance from locked inventory
        if: needs.browser-scope.outputs.docs_only != 'true'
        run: node -p "require('./security/node_modules/@playwright/test/package.json').version"
      - name: Install Chromium browser only (avoid slow apt dependency update)
        if: needs.browser-scope.outputs.docs_only != 'true'
        run: node security/node_modules/@playwright/test/cli.js install chromium
      - name: Run ILLYRIAN module, QA Lab, keyboard, and visual evidence tests
        if: needs.browser-scope.outputs.docs_only != 'true'
        run: node security/node_modules/@playwright/test/cli.js test
      - name: Preserve failed-case screenshots and traces
        if: failure() && needs.browser-scope.outputs.docs_only != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: illyrian-v17-qa-failures
          path: qa-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Save preview screenshots for later human review
        if: always() && needs.browser-scope.outputs.docs_only != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: illyrian-v17-visual-review
          path: qa-results/visual/
          if-no-files-found: ignore
          retention-days: 14

      - name: Save localization inventory for translation audit
        if: always() && needs.browser-scope.outputs.docs_only != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: illyrian-v17-i18n-inventory
          path: qa-results/i18n-inventory/
          if-no-files-found: ignore
          retention-days: 14

  # Bounded WebKit engine probe, not an iOS-device or VoiceOver certification.
  # PR-only avoids repeating WebKit work on the same feature push.
  webkit-smoke:
    name: webkit-smoke-${{ github.event_name }}
    if: always() && github.repository == 'titanfit102-bit/Illyrian' && github.event_name == 'pull_request' && needs.browser-smoke.result == 'success'
    needs: [browser-scope, browser-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      NODE_PATH: ${{ github.workspace }}/security/node_modules
    steps:
      - name: Documentation-only browser evidence reuse
        if: needs.browser-scope.outputs.docs_only == 'true'
        run: echo 'No browser tests executed here; classifier summary links the successful unchanged runtime.'
      - name: Checkout isolated demo branch (read-only)
        if: needs.browser-scope.outputs.docs_only != 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Browser evidence base ${{ github.event.pull_request.base.sha }}
        if: needs.browser-scope.outputs.docs_only != 'true'
        run: echo 'Recording tested PR base in immutable step metadata.'
      - name: Set up Node.js
        if: needs.browser-scope.outputs.docs_only != 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install locked Playwright test runner
        if: needs.browser-scope.outputs.docs_only != 'true'
        run: npm ci --prefix security --ignore-scripts --no-audit --no-fund
      - name: Report runner provenance from locked inventory
        if: needs.browser-scope.outputs.docs_only != 'true'
        run: node -p "require('./security/node_modules/@playwright/test/package.json').version"
      - name: Install WebKit and CI system libraries
        if: needs.browser-scope.outputs.docs_only != 'true'
        run: |
          # Azure's Ubuntu mirror timed out before tests; use Ubuntu's official archive.
          # Existing apt signatures/keys and the locked Playwright inventory stay intact.
          sudo python3 - <<'PYMIRROR'
          from pathlib import Path
          mirrors = Path('/etc/apt/apt-mirrors.txt')
          if mirrors.exists():
              original = mirrors.read_text()
              updated = original.replace('http://azure.archive.ubuntu.com/ubuntu', 'https://archive.ubuntu.com/ubuntu').replace('https://azure.archive.ubuntu.com/ubuntu', 'https://archive.ubuntu.com/ubuntu')
              if updated != original:
                  mirrors.write_text(updated)
          PYMIRROR
          node security/node_modules/@playwright/test/cli.js install --with-deps webkit
      - name: Run bounded WebKit Reels and Stories keyboard smoke
        if: needs.browser-scope.outputs.docs_only != 'true'
        run: node security/node_modules/@playwright/test/cli.js test --config=playwright.webkit.config.cjs
      - name: Preserve WebKit failures for diagnosis
        if: failure() && needs.browser-scope.outputs.docs_only != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: illyrian-v17-webkit-failures
          path: |
            qa-results/artifacts-webkit/
            qa-results/report-webkit/
          if-no-files-found: ignore
          retention-days: 7
