<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1100" viewBox="0 0 1440 1100" role="img" aria-labelledby="title desc"><title id="title">ILLYRIAN iOS · Njoftimet dhe Quick Reply — propozim 6.2</title><desc id="desc">Gjashtë pamje skematike me të dhëna fiktive. Light dhe Dark: lock screen i redaktuar, bisedë e zgjeruar, dhe përgjigje direkte pas zhbllokimit. Nuk janë kapje ekrani ose implementim native.</desc>
