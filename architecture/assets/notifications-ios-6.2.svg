<text x="36" y="88" font-family="DejaVu Sans, sans-serif" font-size="31" font-weight="700" fill="#24141D">iOS · Njoftimet dhe Quick Reply</text>
<text x="36" y="119" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#685B65">MOCKUP SKEMATIK · JO OS CAPTURE · JO FUNKSION NATIVE · TË DHËNA FIKTIVE</text>
<text x="36" y="146" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#685B65">OS kontrollon përmasat, fontet, zgjerimin, tastierën dhe autentikimin. Pamja përfundimtare kërkon test fizik.</text>
